# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.1.5

package:
  name: vizro-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vizro-mcp/vizro_mcp-${{ version }}.tar.gz
  sha256: 87deb85086a840ed152f5c7d4dab23cca8b788c8016948de009578d756cbbcc1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - vizro-mcp = vizro_mcp:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.28.1
    - mcp >=2.0.0
    - vizro >=1.0.0
    - click >=8.1.7
    - pandas
tests:
  - python:
      imports:
        - vizro_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python
    script:
      - vizro-mcp --help

about:
  summary: MCP server to help create Vizro dashboards and charts
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/vizro-mcp/
  description: Vizro-MCP is a Python library that provides a server to help create Vizro dashboards and charts.
  repository: https://github.com/mckinsey/vizro
  documentation: https://vizro.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - rxm7706
